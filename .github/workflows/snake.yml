name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  push:
    branches:
      - main                 # runs on every push to main
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: oculus54
          outputs: |
  	    dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-forgejo-dark.svg?color_snake=#2b8a78&color_dots=#161b22,#0e4429,#1a5c3a,#2b8a78,#40c463

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}